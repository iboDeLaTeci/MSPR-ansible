---
# =============================================================================
# Rôle "cert_manager" : installation de cert-manager et création d'un
# ClusterIssuer autosigné, utilisé pour générer le certificat SSL/TLS d'Odoo.
#
# Le sujet précise que les certificats autosignés sont acceptés pour ce PoC :
# pas besoin de Let's Encrypt ni d'une CA publique, un ClusterIssuer
# "selfSigned" suffit.
# =============================================================================

- name: Ajouter le dépôt Helm Jetstack (cert-manager)
  kubernetes.core.helm_repository:
    name: "{{ cert_manager_chart_repo_name }}"
    repo_url: "{{ cert_manager_chart_repo_url }}"

- name: Déployer cert-manager via Helm (avec ses CRD)
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: "{{ cert_manager_release_name }}"
    chart_ref: "{{ cert_manager_chart_name }}"
    chart_version: "{{ cert_manager_chart_version | default(omit, true) }}"
    release_namespace: "{{ cert_manager_namespace }}"
    create_namespace: true
    wait: true
    wait_timeout: 5m0s
    values:
      # Installe les CustomResourceDefinitions (Certificate, ClusterIssuer,
      # etc.) nécessaires en même temps que le chart.
      crds:
        enabled: true

- name: Attendre que le webhook cert-manager soit disponible
  # Le webhook doit être prêt avant de pouvoir créer un ClusterIssuer, sinon
  # la validation admission échoue avec une erreur de connexion au webhook.
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Deployment
    namespace: "{{ cert_manager_namespace }}"
    name: "{{ cert_manager_release_name }}-webhook"
  register: cert_manager_webhook
  until: >
    cert_manager_webhook.resources | length > 0 and
    cert_manager_webhook.resources[0].status.availableReplicas | default(0) >= 1
  retries: 30
  delay: 10

- name: Créer le ClusterIssuer autosigné pour la génération des certificats TLS
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ cluster_issuer_name }}"
      spec:
        selfSigned: {}
