---
# Installation du control-plane K3s (mission 6).

- name: Vérifier si K3s est déjà installé sur ce noeud
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Installer K3s en mode server (control-plane)
  ansible.builtin.shell: |
    curl -sfL {{ k3s_install_url }} | \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      sh -s - server \
        --disable traefik \
        --write-kubeconfig-mode 644 \
        --tls-san {{ ansible_host }}
  args:
    executable: /bin/bash
  when: not k3s_binary.stat.exists
  # --disable traefik : ingress-nginx est déployé nous-mêmes (mission 7),
  #                      pas besoin du contrôleur Traefik intégré à K3s.
  # --tls-san          : ajoute l'IP publique du control-plane au certificat
  #                      du kubeconfig, afin de pouvoir s'y connecter depuis
  #                      l'extérieur du VPC une fois le kubeconfig rapatrié.

- name: S'assurer que le service k3s est démarré et activé au boot
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true

- name: Attendre que le control-plane soit prêt (statut Ready)
  ansible.builtin.command: >
    k3s kubectl get nodes -o jsonpath={.items[0].status.conditions[?(@.type=="Ready")].status}
  register: k3s_cp_ready
  until: k3s_cp_ready.stdout == "True"
  retries: 30
  delay: 10
  changed_when: false

- name: Lire le token de jonction du cluster
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw

- name: Exposer le token comme fait partagé (réutilisé par les workers dans la même exécution)
  ansible.builtin.set_fact:
    k3s_node_token: "{{ k3s_token_raw.content | b64decode | trim }}"
