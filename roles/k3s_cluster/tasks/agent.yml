---
# Installation d'un worker K3s et jonction au control-plane (mission 6).
#
# Le token et l'IP privée du control-plane sont lus directement dans les
# "hostvars" du control-plane : comme la play "server" s'exécute avant cette
# play dans le même run (voir playbooks/deploy_k3s_cluster.yml), les facts
# qui y ont été positionnés (k3s_node_token) restent disponibles ici.

- name: Vérifier si K3s est déjà installé sur ce noeud
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Installer K3s en mode agent et rejoindre le control-plane
  ansible.builtin.shell: |
    curl -sfL {{ k3s_install_url }} | \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      K3S_URL="https://{{ hostvars[groups['k3s_control_plane'][0]]['private_ip'] }}:6443" \
      K3S_TOKEN="{{ hostvars[groups['k3s_control_plane'][0]]['k3s_node_token'] }}" \
      sh -s - agent
  args:
    executable: /bin/bash
  when: not k3s_binary.stat.exists
  # On rejoint le control-plane via son IP PRIVÉE (même VPC) plutôt que son
  # IP publique : trafic interne au cluster, plus rapide et moins exposé.

- name: S'assurer que le service k3s-agent est démarré et activé au boot
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true
