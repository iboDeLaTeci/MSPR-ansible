[defaults]
# Répertoire (et non plus un seul fichier) : agrège automatiquement
# inventory/hosts.ini (localhost, missions 7) et inventory/k3s_hosts.ini
# (généré par Terraform, missions 6), sans avoir à préciser -i à chaque fois.
inventory      = inventory/
collections_path = ./collections
roles_path     = ./roles
host_key_checking = False
stdout_callback = yaml
